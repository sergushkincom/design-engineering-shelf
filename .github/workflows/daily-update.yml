name: Daily README update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update last-updated date
        run: |
          TODAY=$(date -u +"%Y-%m-%d")
          sed -i "s/Last updated: [0-9]\{4\}-[0-9]\{2\}\(-[0-9]\{2\}\)\{0,1\}/Last updated: $TODAY/" README.md

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update last-updated date"
          git push

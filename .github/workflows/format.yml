name: Entry format

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests for the checker
        run: python -m unittest discover -s tests -v
      - name: Check README entries
        run: python scripts/check_entries.py README.md
